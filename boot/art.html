<!doctype html>
<!-- DedSec emblem: hooded reaper with spread arms + chunky overlapping graffiti
     wordmark, on a dense field of skulls. Rendered to background.png (1920x1080)
     for the GRUB theme and the login greeter. Self-contained. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #07090b; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.85; }
  .dither { position: absolute; inset: 0; opacity: 0.14; mix-blend-mode: overlay;
    background-image: radial-gradient(#fff 0.7px, transparent 0.9px); background-size: 3px 3px; }
  .vig { position: absolute; inset: 0; background: radial-gradient(120% 120% at 50% 48%, transparent 45%, #000000cc 100%); }
  .emblem { position: relative; width: 1180px; height: auto; }

  /* figure */
  .fig-body { fill: url(#hatch); stroke: #05070a; stroke-width: 5; stroke-linejoin: round; }
  .fig-cav  { fill: #06080a; }
  .sk-dome  { fill: #eef1f2; stroke: #05070a; stroke-width: 2.5; }
  .sk-hole  { fill: #06080a; }
  .sk-glow  { filter: drop-shadow(0 0 14px #ff1a35) drop-shadow(0 0 4px #ff0033); }
  .sk-drip  { fill: #ff1a35; }

  /* wordmark */
  .wm { fill: url(#hatch); stroke: #05070a; stroke-width: 8; stroke-linejoin: round; }
  .wm-drip { fill: url(#hatch); stroke: #05070a; stroke-width: 3; }

  .tag { position: absolute; left: 0; right: 0; text-align: center; bottom: 8%;
    font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, monospace; }
  .tag .a { color: #d7dbdc; letter-spacing: 0.36em; font-size: 25px; }
  .tag .b { color: #6a7073; letter-spacing: 0.14em; font-size: 16px; margin-top: 6px; }
</style>
</head>
<body>
  <svg width="0" height="0"><defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="11" fill="#ccd2d4"/><rect width="5" height="11" fill="#1b2024"/>
    </pattern>
    <!-- dense field of big skulls -->
    <pattern id="skulltile" width="86" height="86" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="86" height="86" fill="#0a0c0e"/>
      <g transform="translate(12,10) scale(0.95)" fill="#252b2f">
        <path d="M32 2 C17 2 7 13 7 28 c0 9 4 15 9 19 l0 7 c0 2 2 4 4 4 l24 0 c2 0 4-2 4-4 l0-7 c5-4 9-10 9-19 C57 13 47 2 32 2 Z"/>
      </g>
      <g transform="translate(12,10) scale(0.95)" fill="#0a0c0e">
        <ellipse cx="22" cy="27" rx="6" ry="7"/><ellipse cx="42" cy="27" rx="6" ry="7"/>
        <polygon points="32,32 28,41 36,41"/>
        <rect x="22" y="48" width="3" height="8"/><rect x="28" y="48" width="3" height="8"/>
        <rect x="34" y="48" width="3" height="8"/><rect x="40" y="48" width="3" height="8"/>
      </g>
    </pattern>
  </defs></svg>

  <svg class="bg" preserveAspectRatio="xMidYMid slice"><rect width="100%" height="100%" fill="url(#skulltile)"/></svg>
  <div class="dither"></div>
  <div class="vig"></div>

  <div class="stage">
    <svg class="emblem" viewBox="0 0 900 620">
      <!-- ── hooded reaper, arms spread ─────────────────────────────────── -->
      <g filter="url(#rough2)">
        <!-- one silhouette: hood → shoulders → arms spread wide → ragged hem -->
        <path class="fig-body" d="
          M450 40
          C382 40 338 92 344 168
          C347 200 358 226 376 244
          C300 258 216 292 166 348
          C132 386 116 430 112 470
          L150 452 L146 492 L182 466 L186 506 L222 476 L230 514
          L266 484 L276 520 L312 490 L322 524 L358 496 L370 528
          L406 500 L418 530 L450 504 L482 530 L494 500 L530 528
          L542 496 L578 524 L588 490 L624 520 L634 484 L670 514
          L678 476 L714 506 L718 466 L754 492 L750 452 L788 470
          C784 430 768 386 734 348
          C684 292 600 258 524 244
          C542 226 553 200 556 168
          C562 92 518 40 450 40 Z"/>
        <!-- face cavity -->
        <path class="fig-cav" d="M450 78 C398 78 372 118 378 166 C383 208 412 236 450 236 C488 236 517 208 522 166 C528 118 502 78 450 78 Z"/>
      </g>

      <!-- skull inside the hood -->
      <g class="sk-glow">
        <g filter="url(#rough2)">
          <path class="sk-dome" d="M450 104 C418 104 396 128 396 160 c0 15 6 25 14 32 l0 12 c0 4 3 7 7 7 l66 0 c4 0 7-3 7-7 l0-12 c8-7 14-17 14-32 C504 128 482 104 450 104 Z"/>
          <ellipse class="sk-hole" cx="428" cy="156" rx="13" ry="15"/>
          <ellipse class="sk-hole" cx="472" cy="156" rx="13" ry="15"/>
          <polygon class="sk-hole" points="450,164 440,186 460,186"/>
          <g class="sk-hole">
            <rect x="424" y="196" width="6" height="18"/><rect x="435" y="196" width="6" height="20"/>
            <rect x="446" y="196" width="6" height="20"/><rect x="457" y="196" width="6" height="20"/>
            <rect x="468" y="196" width="6" height="18"/>
          </g>
          <rect class="sk-drip" x="425" y="170" width="5" height="30"/>
          <rect class="sk-drip" x="470" y="170" width="5" height="21"/>
        </g>
      </g>

      <!-- ── chunky overlapping graffiti wordmark, across the figure ─────── -->
      <g filter="url(#rough)" transform="translate(0,26) rotate(-3 450 430)">
        <!-- D -->
        <g transform="translate(28,352) rotate(-4) scale(1.16)">
          <path class="wm" d="M8 6 L60 10 C92 16 106 46 104 78 C102 116 80 140 44 142 L4 140 Z
                              M36 40 L52 43 C68 48 71 62 69 76 C67 92 58 100 42 100 L34 100 Z"/>
        </g>
        <!-- E -->
        <g transform="translate(158,368) rotate(3) scale(1.16)">
          <path class="wm" d="M10 8 L100 2 L98 32 L44 35 L44 56 L88 53 L86 79 L44 79 L44 104 L102 100 L100 132 L6 134 Z"/>
        </g>
        <!-- D -->
        <g transform="translate(292,346) rotate(-2) scale(1.16)">
          <path class="wm" d="M8 6 L60 10 C92 16 106 46 104 78 C102 116 80 140 44 142 L4 140 Z
                              M36 40 L52 43 C68 48 71 62 69 76 C67 92 58 100 42 100 L34 100 Z"/>
        </g>
        <!-- S -->
        <g transform="translate(424,366) rotate(4) scale(1.16)">
          <path class="wm" d="M98 24 C80 6 30 2 16 26 C2 50 12 74 46 82 C72 88 82 94 77 106
                              C72 118 44 118 20 104 L10 132 C40 148 92 146 104 118
                              C117 88 99 68 62 58 C40 52 33 45 38 35 C43 25 72 28 92 42 Z"/>
        </g>
        <!-- E -->
        <g transform="translate(556,350) rotate(-3) scale(1.16)">
          <path class="wm" d="M10 8 L100 2 L98 32 L44 35 L44 56 L88 53 L86 79 L44 79 L44 104 L102 100 L100 132 L6 134 Z"/>
        </g>
        <!-- C -->
        <g transform="translate(688,366) rotate(2) scale(1.16)">
          <path class="wm" d="M100 30 C82 8 34 4 18 34 C2 64 10 108 42 128 C66 143 92 136 106 120
                              L90 96 C80 106 60 111 48 98 C34 82 34 50 48 40 C60 31 76 34 86 46 Z"/>
        </g>
        <!-- paint drips off the letters -->
        <rect class="wm-drip" x="96"  y="492" width="9" height="46"/>
        <rect class="wm-drip" x="352" y="500" width="8" height="34"/>
        <rect class="wm-drip" x="590" y="496" width="9" height="52"/>
        <rect class="wm-drip" x="806" y="504" width="8" height="30"/>
      </g>
    </svg>

    <div class="tag">
      <div class="a">YOU ARE BEING WATCHED</div>
      <div class="b">ctOS // — now watch your own.</div>
    </div>
  </div>
</body>
</html>
