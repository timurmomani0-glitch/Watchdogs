# ctOS · Hyprland session — the dashboard as your desktop shell.
# Installed to ~/.config/hypr/hyprland.conf by rice/install.sh.
# DedSec greyscale palette matches the dashboard: light #d7dbdc, mid #9aa0a2, bg #060809.

monitor = , preferred, auto, 1

# ── Autostart ────────────────────────────────────────────────────────────────
exec-once = hypridle
exec-once = systemctl --user start ctos.service
exec-once = ~/.config/ctos/launch-ctos.sh

# ── Look ─────────────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(d7dbdcee) rgba(9aa0a2ee) 45deg
    col.inactive_border = rgba(23282baa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.15
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(d7dbdc44)
    }
}

animations {
    enabled = true
    bezier = ctos, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, ctos, slide
    animation = fadeIn, 1, 5, ctos
    animation = workspaces, 1, 4, ctos, slidefade
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgba(060809ff)
    force_default_wallpaper = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ── The dashboard is a fullscreen, borderless kiosk window ────────────────────
windowrulev2 = fullscreen, class:^([Cc]hromium|[Cc]hromium-browser|[Gg]oogle-chrome|[Bb]rave-browser)$
windowrulev2 = noborder,   class:^([Cc]hromium|[Cc]hromium-browser|[Gg]oogle-chrome|[Bb]rave-browser)$

# ── Keybinds ─────────────────────────────────────────────────────────────────
$mod = SUPER
bind = $mod, Return, exec, foot
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, L, exec, hyprlock
bind = $mod, R, exec, ~/.config/ctos/launch-ctos.sh
bind = $mod SHIFT, E, exit,
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
