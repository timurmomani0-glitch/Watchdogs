# ctOS · hyprlock lock screen. Installed to ~/.config/hypr/hyprlock.conf.
background {
    monitor =
    color = rgba(060809ff)
    blur_passes = 2
    blur_size = 6
}

general {
    hide_cursor = true
    grace = 0
}

# Wordmark
label {
    monitor =
    text = DEDSEC
    color = rgba(d7dbdcff)
    font_size = 88
    font_family = monospace
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = // ctOS — SYSTEM LOCKED
    color = rgba(9aa0a2ff)
    font_size = 15
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(eef1f2ff)
    font_size = 46
    font_family = monospace
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(6a7073ff)
    inner_color = rgba(0b0e10ff)
    font_color = rgba(eef1f2ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##4c5254">authenticate</span>
    position = 0, -90
    halign = center
    valign = center
}
