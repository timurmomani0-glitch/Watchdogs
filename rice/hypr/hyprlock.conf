# ctOS · hyprlock lock screen. Installed to ~/.config/hypr/hyprlock.conf.
background {
    monitor =
    color = rgba(050809ff)
    blur_passes = 2
    blur_size = 6
}

general {
    hide_cursor = true
    grace = 0
}

# Wordmark
label {
    monitor =
    text = ctOS
    color = rgba(00e5ffff)
    font_size = 96
    font_family = monospace
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = // SYSTEM LOCKED
    color = rgba(5c7d84ff)
    font_size = 15
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(cfeef2ff)
    font_size = 46
    font_family = monospace
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(0a8ea3ff)
    inner_color = rgba(0a1013ff)
    font_color = rgba(cfeef2ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##5c7d84">authenticate</span>
    position = 0, -90
    halign = center
    valign = center
}
