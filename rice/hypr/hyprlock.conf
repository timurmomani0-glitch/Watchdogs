# ctOS · hyprlock lock screen. Installed to ~/.config/hypr/hyprlock.conf.
background {
    monitor =
    color = rgba(05080bff)
    blur_passes = 2
    blur_size = 6
}

general {
    hide_cursor = true
    grace = 0
}

# Wordmark
label {
    monitor =
    text = DEDSEC
    color = rgba(1fd6cfff)
    font_size = 88
    font_family = monospace
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = // ctOS — SYSTEM LOCKED
    color = rgba(ff7a1aff)
    font_size = 15
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(e8f0f1ff)
    font_size = 46
    font_family = monospace
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(0e8f8cff)
    inner_color = rgba(0a0f13ff)
    font_color = rgba(e8f0f1ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##566e74">authenticate</span>
    position = 0, -90
    halign = center
    valign = center
}
